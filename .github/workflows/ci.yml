name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          # The analyst SDK clients (openai / anthropic) validate a non-empty api_key at
          # construction. Tests mock the actual analyst CALLS, but run_scan still constructs
          # clients up front, so hand them throwaway keys. No real API calls are made — no
          # secrets are needed.
          ANTHROPIC_API_KEY: ci-dummy-key
          ANALYST_API_KEY: ci-dummy-key
          ANALYST_FALLBACK_API_KEY: ci-dummy-key
          ANALYST_FALLBACK2_API_KEY: ci-dummy-key
        run: pytest -q
